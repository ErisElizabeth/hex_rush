    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>hex rush</title>
    <link rel="stylesheet" href="styles.css?v=7.0">
  </head>
  <body>
    <main class="game-shell" aria-label="hex rush game">
      <canvas id="gameCanvas" aria-label="Play area"></canvas>
      <div id="centerScoreWrap" class="center-score-wrap" aria-hidden="true">
        <div id="centerScore" class="center-score">0</div>
        <div id="highScore" class="high-score" hidden>high score: 0</div>
        <div id="highScoreName" class="high-score-name" hidden></div>
      </div>

      <section id="overlay" class="overlay">
        <h1>hex rush</h1>
        <p>collect dark hexagons<br>avoid red ones</p>
        <div id="overlayHighScore" class="overlay-high-score" hidden>
          <span id="overlayHighScoreValue">high score: 0</span>
          <span id="overlayHighScoreName" hidden></span>
        </div>
        <form id="nameForm" class="name-form" hidden>
          <label for="nameInput">new high score</label>
          <input id="nameInput" type="text" maxlength="40" autocomplete="off" spellcheck="false">
          <button id="saveNameButton" type="submit">save</button>
        </form>
        <button id="startButton" type="button">play</button>
      </section>
    </main>

    <audio id="introAudio" src="hex_audio_intro.mp3" preload="auto"></audio>
    <audio id="loopAudio" src="hex_audio_loop.ogg" preload="auto" loop></audio>
    <audio id="introLostAudio" src="hex_audio_intro_lost.mp3" preload="auto"></audio>
    <audio id="loopLostAudio" src="hex_audio_loop_lost.ogg" preload="auto" loop></audio>

    <script src="game.js?v=7.0"></script>
  </body>
</html>
